# Lives at .github/workflows/deploy.yml in github.com/newportcapitalventures/newportcapitalventures.github.io.
# That repo holds only site.zip (the DEPLOY_TARGET=github-pages build of dist/); this unpacks it and publishes it to Pages.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && unzip -q site.zip -d _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
